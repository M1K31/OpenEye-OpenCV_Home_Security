# Build dlib wheels for Windows.
#
# WHY THIS EXISTS
#
# dlib publishes no binary wheel for any platform — PyPI carries only
# dlib-<version>.tar.gz. On macOS and Linux that is survivable, because a
# compiler is usually present and the build succeeds. On Windows it is not:
# the build needs CMake and the Visual Studio C++ build tools, which a normal
# developer machine does not have, so `pip install` fails and takes every other
# package in the same command down with it.
#
# WHY OUR OWN WHEEL RATHER THAN dlib-bin
#
# dlib-bin is a third-party repackaging that ships prebuilt wheels, and it
# works — install-deps.ps1 falls back to it. But it is published under a
# DIFFERENT DISTRIBUTION NAME, and pip resolves dependencies by distribution
# name rather than import name. face_recognition declares
# "Requires-Dist: dlib (>=19.7)", so with dlib-bin installed pip still fetches
# the dlib sdist and tries to build it. Working around that needs --no-deps and
# re-listing face_recognition's own dependencies by hand.
#
# A wheel we build is named `dlib`, so it satisfies that requirement directly
# and `pip install face_recognition` behaves normally. That is the entire point
# of doing this ourselves.
#
# LICENSING
#
# dlib is Boost Software License 1.0, which permits redistribution in binary
# form. BSL-1.0 explicitly exempts "machine-executable object code generated by
# a source language processor" from its notice requirement, so a compiled wheel
# carries no attribution obligation. The licence is included in the release
# anyway, because saying where a binary came from is worth more than the
# minimum the licence demands.
#
# WHAT THIS DOES NOT CHANGE
#
# macOS, Linux and Raspberry Pi continue to use official dlib from PyPI, built
# from source as they do today. This workflow is Windows-only.

name: Build dlib wheels (Windows)

on:
  workflow_dispatch:
    inputs:
      dlib_version:
        description: 'dlib version to build (must exist on PyPI)'
        required: true
        default: '20.0.1'
      publish:
        description: 'Attach the wheels to a GitHub release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # needed only when publish=true

jobs:
  build:
    name: dlib ${{ inputs.dlib_version }} · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions OpenEye supports. numpy<2 and opencv<4.11 cap this at
        # 3.12; there is no point shipping a 3.13 wheel the application cannot
        # be installed alongside.
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The build, the toolchain checks and the verification all live in
      # scripts/build-dlib-wheel.ps1 rather than here.
      #
      # Duplicating them would mean CI and a developer's local run could drift,
      # and the local run is the one that matters most: this workflow cannot be
      # triggered from the Actions tab until the file reaches the default
      # branch, so building by hand is the first thing anyone will actually do.
      #
      # The script asserts CMake and the MSVC C++ tools are present, builds with
      # pip's build isolation disabled, and verifies in a clean venv that
      # `pip install face_recognition` resolves against the wheel without
      # --no-deps and without pulling dlib-bin. It exits non-zero on any of
      # those, so no extra assertions are needed here.
      - name: Build and verify the wheel
        shell: pwsh
        run: |
          .\scripts\build-dlib-wheel.ps1 `
            -DlibVersion '${{ inputs.dlib_version }}' `
            -OutDir dist

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: dlib-${{ inputs.dlib_version }}-py${{ matrix.python-version }}-win_amd64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Attach wheels to a release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect every wheel
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="dlib-windows-v${{ inputs.dlib_version }}"
          ls -la wheels/
          # Idempotent: re-running the workflow for the same version replaces
          # the assets rather than failing on an existing tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" wheels/*.whl --clobber
          else
            gh release create "$tag" wheels/*.whl \
              --title "dlib ${{ inputs.dlib_version }} — Windows wheels" \
              --notes "Windows wheels for dlib ${{ inputs.dlib_version }}, built from the
          official PyPI sdist on windows-latest.

          These exist because dlib publishes no binary wheel for any platform, and
          building it on Windows requires CMake and the Visual Studio C++ build tools.
          They are named \`dlib\`, so \`pip install face_recognition\` resolves against
          them normally — unlike \`dlib-bin\`, which pip does not accept as satisfying
          \`Requires-Dist: dlib\`.

          macOS, Linux and Raspberry Pi are unaffected and continue to use official
          dlib from PyPI.

          dlib is Boost Software License 1.0, which permits binary redistribution."
          fi
