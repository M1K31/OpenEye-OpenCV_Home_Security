# Build dlib wheels for Windows.
#
# WHY THIS EXISTS
#
# dlib publishes no binary wheel for any platform — PyPI carries only
# dlib-<version>.tar.gz. On macOS and Linux that is survivable, because a
# compiler is usually present and the build succeeds. On Windows it is not:
# the build needs CMake and the Visual Studio C++ build tools, which a normal
# developer machine does not have, so `pip install` fails and takes every other
# package in the same command down with it.
#
# WHY OUR OWN WHEEL RATHER THAN dlib-bin
#
# dlib-bin is a third-party repackaging that ships prebuilt wheels, and it
# works — install-deps.ps1 falls back to it. But it is published under a
# DIFFERENT DISTRIBUTION NAME, and pip resolves dependencies by distribution
# name rather than import name. face_recognition declares
# "Requires-Dist: dlib (>=19.7)", so with dlib-bin installed pip still fetches
# the dlib sdist and tries to build it. Working around that needs --no-deps and
# re-listing face_recognition's own dependencies by hand.
#
# A wheel we build is named `dlib`, so it satisfies that requirement directly
# and `pip install face_recognition` behaves normally. That is the entire point
# of doing this ourselves.
#
# LICENSING
#
# dlib is Boost Software License 1.0, which permits redistribution in binary
# form. BSL-1.0 explicitly exempts "machine-executable object code generated by
# a source language processor" from its notice requirement, so a compiled wheel
# carries no attribution obligation. The licence is included in the release
# anyway, because saying where a binary came from is worth more than the
# minimum the licence demands.
#
# WHAT THIS DOES NOT CHANGE
#
# macOS, Linux and Raspberry Pi continue to use official dlib from PyPI, built
# from source as they do today. This workflow is Windows-only.

name: Build dlib wheels (Windows)

on:
  workflow_dispatch:
    inputs:
      dlib_version:
        description: 'dlib version to build (must exist on PyPI)'
        required: true
        default: '20.0.1'
      publish:
        description: 'Attach the wheels to a GitHub release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # needed only when publish=true

jobs:
  build:
    name: dlib ${{ inputs.dlib_version }} · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions OpenEye supports. numpy<2 and opencv<4.11 cap this at
        # 3.12; there is no point shipping a 3.13 wheel the application cannot
        # be installed alongside.
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # windows-latest ships MSVC and CMake already. Asserted rather than
      # assumed: if the image ever drops them the failure should name the
      # cause, not surface as a confusing compiler error 20 minutes in.
      - name: Verify the build toolchain is present
        shell: pwsh
        run: |
          $cmake = Get-Command cmake -ErrorAction SilentlyContinue
          if (-not $cmake) { throw "cmake not found on the runner image" }
          cmake --version
          Write-Host "MSVC:"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property displayName

      - name: Build the wheel
        shell: pwsh
        run: |
          # dlib's pyproject declares requires = [setuptools, wheel, packaging,
          # cmake], and pip's build isolation tries to satisfy that `cmake` from
          # PyPI in a fresh environment. Where no wheel matches the platform it
          # builds cmake FROM SOURCE, which fails — dlib's own setup.py carries
          # the comment "the pip cmake package is busted" about exactly this.
          # Reproduced on linux/arm64: the build died in cmcurl, never reaching
          # dlib at all.
          #
          # Install the build requirements directly and disable isolation, so
          # the runner's own CMake (verified present above) is what gets used.
          python -m pip install --upgrade pip wheel setuptools packaging

          # --no-binary=:all: so this always compiles from the official sdist
          # and never silently repackages someone else's binary.
          python -m pip wheel --no-deps --no-build-isolation --no-binary=:all: `
            --wheel-dir dist "dlib==${{ inputs.dlib_version }}"
          Get-ChildItem dist

      # A wheel that builds but cannot import is the failure this whole effort
      # is about, so prove it in a clean interpreter before publishing.
      - name: Verify the wheel imports and runs
        shell: pwsh
        run: |
          python -m venv verify
          .\verify\Scripts\python.exe -m pip install --upgrade pip "setuptools<82" | Out-Null
          .\verify\Scripts\python.exe -m pip install --find-links dist --only-binary=:all: dlib
          .\verify\Scripts\python.exe -m pip install "numpy<2" pillow click | Out-Null
          # face_recognition must resolve WITHOUT --no-deps. If this step needs
          # it, the wheel is not doing the job it exists to do.
          .\verify\Scripts\python.exe -m pip install --no-build-isolation face_recognition
          .\verify\Scripts\python.exe -c @"
          import numpy, dlib, face_recognition
          img = numpy.zeros((120, 120, 3), dtype=numpy.uint8)
          face_recognition.face_locations(img)
          face_recognition.face_encodings(img)
          print('verified: dlib', dlib.__version__, 'on Python', __import__('sys').version.split()[0])
          "@

      # Guards the claim above. `pip install face_recognition` must not have
      # pulled the sdist and rebuilt dlib — if it did, the wheel was not
      # satisfying the requirement and we have gained nothing over dlib-bin.
      - name: Assert face_recognition used our wheel
        shell: pwsh
        run: |
          $out = .\verify\Scripts\python.exe -m pip list --format=freeze
          if ($out -match 'dlib-bin') { throw "dlib-bin was installed; our wheel did not satisfy the requirement" }
          if (-not ($out -match '^dlib==')) { throw "dlib is not installed under its own name" }
          Write-Host "OK: face_recognition resolved against the dlib wheel built here"

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: dlib-${{ inputs.dlib_version }}-py${{ matrix.python-version }}-win_amd64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Attach wheels to a release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect every wheel
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="dlib-windows-v${{ inputs.dlib_version }}"
          ls -la wheels/
          # Idempotent: re-running the workflow for the same version replaces
          # the assets rather than failing on an existing tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" wheels/*.whl --clobber
          else
            gh release create "$tag" wheels/*.whl \
              --title "dlib ${{ inputs.dlib_version }} — Windows wheels" \
              --notes "Windows wheels for dlib ${{ inputs.dlib_version }}, built from the
          official PyPI sdist on windows-latest.

          These exist because dlib publishes no binary wheel for any platform, and
          building it on Windows requires CMake and the Visual Studio C++ build tools.
          They are named \`dlib\`, so \`pip install face_recognition\` resolves against
          them normally — unlike \`dlib-bin\`, which pip does not accept as satisfying
          \`Requires-Dist: dlib\`.

          macOS, Linux and Raspberry Pi are unaffected and continue to use official
          dlib from PyPI.

          dlib is Boost Software License 1.0, which permits binary redistribution."
          fi
