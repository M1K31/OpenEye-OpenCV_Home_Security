name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        # Uncomment to test on multiple browsers
        # browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: opencv_surveillance/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: opencv_surveillance/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1

      - name: Install Python dependencies
        run: |
          cd opencv_surveillance
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: |
          cd opencv_surveillance/frontend
          npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: |
          cd opencv_surveillance/frontend
          npx playwright install ${{ matrix.browser }} --with-deps

      - name: Build frontend
        run: |
          cd opencv_surveillance/frontend
          npm run build

      - name: Setup test database
        run: |
          cd opencv_surveillance
          # Create test database and run migrations
          python -c "from backend.database.session import Base, engine; Base.metadata.create_all(bind=engine)"

          # Create test admin user using project's auth module
          python -c "
          from backend.database.session import SessionLocal
          from backend.database.models import User
          from backend.core.auth import hash_password

          db = SessionLocal()

          # Check if admin user exists
          existing_user = db.query(User).filter(User.username == 'admin').first()
          if not existing_user:
              user = User(
                  username='admin',
                  email='admin@openeye.local',
                  hashed_password=hash_password('admin'),
                  is_active=True,
                  role='admin'
              )
              db.add(user)
              db.commit()
              print('Test admin user created')
          else:
              print('Test admin user already exists')

          db.close()
          "
        env:
          SECRET_KEY: test-secret-key-for-ci-only

      - name: Start backend server
        run: |
          cd opencv_surveillance
          # Start server in background
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &

          # Wait for server to be ready (max 60 seconds)
          for i in {1..60}; do
            if curl -s http://localhost:8000/api/ > /dev/null; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server to start... ($i/60)"
            sleep 1
          done
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          JWT_SECRET_KEY: test-jwt-key-for-ci-only

      - name: Run E2E tests
        run: |
          cd opencv_surveillance/frontend
          npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: opencv_surveillance/frontend/playwright-report/
          retention-days: 7

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ matrix.browser }}
          path: opencv_surveillance/frontend/test-results/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: opencv_surveillance/frontend/test-results/**/*.png
          retention-days: 7

      - name: Stop backend server
        if: always()
        run: |
          # Kill uvicorn process
          pkill -f "uvicorn backend.main:app" || true
