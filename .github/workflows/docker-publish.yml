name: Docker Build & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  DOCKERHUB_REPO: im1k31s/openeye-opencv_home_security

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKERHUB_REPO }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./opencv_surveillance
        file: ./opencv_surveillance/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Best-effort GitHub Actions layer cache. ignore-error keeps an evicted
        # blob / cache-export "Forbidden" from failing the publish (the cache is
        # an optimization, not a build requirement).
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true
        platforms: linux/amd64

    - name: Verify push
      env:
        IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        echo "Pushed to DockerHub: ${DOCKERHUB_REPO}"
        echo "Tags: ${IMAGE_TAGS}"

    # Scan what was actually published, rather than a locally built approximation
    # of it. This is a surveillance system that people run on their own networks,
    # so the vulnerabilities that matter are the ones in the artifact they pull.
    - name: Scan the published image (Docker Scout)
      uses: docker/scout-action@v1
      with:
        command: cves
        # By digest, not by tag: this scans exactly the artifact that was just
        # pushed, with no dependence on tag resolution and no interpolation of a
        # ref name into the job.
        image: ${{ env.DOCKERHUB_REPO }}@${{ steps.build.outputs.digest }}
        # Only what a maintainer would act on. Reporting every low-severity
        # finding in a Debian base image trains everyone to ignore the output,
        # which is worse than not scanning.
        only-severities: critical,high
        only-fixed: true
        sarif-file: scout-cves.sarif
        summary: true
      continue-on-error: true

    # A findings report that fails the release would mean a CVE in a base image
    # blocks a fix the users are waiting for. The scan informs; it does not gate.
    - name: Publish scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-scout-cves
        path: scout-cves.sarif
        if-no-files-found: ignore

    - name: Update DockerHub description
      # Cosmetic: syncs the repo README to Docker Hub. The Docker Hub description
      # API needs password-based (JWT) auth, which a push *access token* can't do
      # (401), so don't fail the publish over it. To enable, set DOCKERHUB_TOKEN
      # to an account password or a token with description permissions.
      continue-on-error: true
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ env.DOCKERHUB_REPO }}
        readme-filepath: ./DOCKER.md
        short-description: "AI-powered home security with face recognition, motion detection & smart home integration. 100% free."
