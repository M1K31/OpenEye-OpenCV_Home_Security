name: CI - Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter, do not cancel siblings on the first red one. With
      # the default fail-fast the matrix surfaced one version at a time: 3.11 failed
      # linting and cancelled 3.9/3.10, then 3.10 failed on a missing dependency and
      # cancelled 3.9/3.11, so each push proved only that one version was broken and
      # never that the others were green.
      fail-fast: false
      matrix:
        # 3.12 is what the shipped macOS bundle runs, and the Docker image
        # now matches it. It was absent here, so CI certified three versions
        # and never the one users have. 3.9 stays because the developer
        # machine still runs it; drop it once that moves.
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libopencv-dev \
          libopenblas-dev \
          liblapack-dev \
          libportaudio2 \
          libgl1 \
          libglib2.0-0 \
          ffmpeg
    
    - name: Install Python dependencies
      run: |
        cd opencv_surveillance
        python -m pip install --upgrade pip
        # Use lightweight CI requirements to avoid disk space issues
        pip install -r requirements-ci.txt
        # Ecosystem packages from PyPI. This replaced a git URL pinned to a commit
        # SHA (F-06: stop an unpinned branch changing the build). PyPI releases are
        # immutable per version, so the floors in requirements-ecosystem.txt carry
        # that intent. The old SHA also named the pre-rename `ecosystem-auth`, which
        # ships the same ecosystem_auth module as the published `appecosystem-auth`.
        pip install -r requirements-ecosystem.txt
    
    - name: Run linting
      run: |
        cd opencv_surveillance
        pip install flake8 black
        # HARD GATE: real breakage (syntax errors, undefined names) fails the build.
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=__pycache__,venv
        # ADVISORY: style issues are reported but do not fail the build (--exit-zero).
        flake8 backend --count --exit-zero --max-line-length=120 --exclude=__pycache__,venv --ignore=E501,W503,E203 --statistics

    - name: Run tests
      # Hard ceiling on the whole job. Belt-and-braces with --timeout below: if a test
      # wedges in a way pytest-timeout cannot interrupt, the job still ends in minutes
      # instead of burning a runner until GitHub's 6-hour limit.
      timeout-minutes: 25
      env:
        # ecosystem auth is fail-closed; throwaway secret so auth paths run in CI.
        # 64 hex characters, matching the shape the application requires of a
        # real one. The previous value read "…-not-for-production-…", which the
        # placeholder check now (correctly) refuses — a CI secret still has to
        # be a valid secret, or CI stops exercising the signed path at all.
        ECOSYSTEM_HMAC_SECRET: "3f9a1c7e4b2d8056a1e3c5f70b9d24618c4a7e0d3b5f9126ae4c8d0b7f3a5e29"
        # Deterministic signing keys. Without these the app generates a per-install
        # key on the fly, which works but writes a key file and logs a warning on
        # every run.
        SECRET_KEY: "ci-test-secret-key-not-for-production-0123456789abcdef0123456789"
        JWT_SECRET_KEY: "ci-test-jwt-key-not-for-production-abcdef0123456789abcdef0123"
      run: |
        cd opencv_surveillance
        # Tests must pass — no masking. A failing suite now fails the pipeline (F-03).
        #
        # --timeout: the suite contains tests that can block on I/O. Without a
        # per-test timeout a single hang holds the runner open for hours and reports
        # nothing useful; with it the offender fails and names itself.
        # No -x: running to completion gives the full failure set in one pass, which
        # is far more actionable than stopping at whichever test happens to fail first.
        pytest tests/ -v --cov=backend --cov-report=xml \
          --timeout=60 --timeout-method=thread \
          --ignore=tests/e2e
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./opencv_surveillance/coverage.xml
        flags: unittests
        name: codecov-umbrella
      if: matrix.python-version == '3.12'  # report against the shipped version
      continue-on-error: true

  test-windows:
    name: Test Windows / Python 3.12
    runs-on: windows-latest
    # Non-blocking for now. Nothing in this project has ever been proven to
    # install, import or start on Windows, so the first job's value is the
    # signal, not the gate. Promote to required once the platform backlog lands.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ffmpeg is a hard prerequisite for recording and clip export, and the
      # Windows runners do not carry one.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        working-directory: opencv_surveillance
        # requirements.txt, NOT requirements-ci.txt.
        #
        # requirements-ci.txt still lists dlib and face_recognition. dlib
        # publishes no Windows wheel for any CPython version, so pip would build
        # it from source, fail, and take every other package down with it — the
        # job would prove only that, which is already known.
        #
        # requirements.txt is the documented developer install and was made
        # Windows-installable deliberately: dlib and face_recognition moved to
        # requirements-face-recognition.txt, and netifaces is excluded here by
        # an environment marker for the same reason. Testing it is testing what
        # a Windows developer actually runs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Import the application
        working-directory: opencv_surveillance
        # The first thing to establish, and historically the thing that failed:
        # an unguarded optional import aborts before anything starts.
        run: python -c "import backend.main; print('import OK')"
        env:
          SECRET_KEY: 7c1f4b9e2a6d0538f7b2e4c6a9d1038b5e7c2f4a6d9b1e3c5a7f0d2b4e6c8a1f
          JWT_SECRET_KEY: 2e9a7c5f1b3d6084a2c4e6f8b0d2a4c6e8f1a3c5e7b9d0f2a4c6e8b1d3f5a7c9

      - name: Report what this machine can run
        working-directory: opencv_surveillance
        # doctor exits non-zero when prerequisites are missing, which is
        # expected here — the interest is in WHICH ones, so the result is
        # reported rather than enforced.
        run: python manage.py doctor
        continue-on-error: true

      - name: Run tests
        working-directory: opencv_surveillance
        timeout-minutes: 25
        # Face recognition is absent by design (see the install step), so tests
        # that need it are deselected rather than left to fail. Everything else
        # runs, and a failure here is real Windows signal.
        run: pytest tests/ -v --timeout=60 --timeout-method=thread -m "not face" -p no:cacheprovider
        env:
          # Real values, not placeholders. backend/core/auth.py refuses a key
          # that looks like a placeholder — "not-for-production" and friends are
          # rejected — and would silently generate its own instead, so a
          # placeholder here means CI stops testing the configured path.
          SECRET_KEY: 7c1f4b9e2a6d0538f7b2e4c6a9d1038b5e7c2f4a6d9b1e3c5a7f0d2b4e6c8a1f
          JWT_SECRET_KEY: 2e9a7c5f1b3d6084a2c4e6f8b0d2a4c6e8f1a3c5e7b9d0f2a4c6e8b1d3f5a7c9
          ECOSYSTEM_HMAC_SECRET: 9d3f7a1c5e8b2046d9f3a7c1e5b8024fd6a9c3e7b1f5a8d2c4e6b0f3a7d9c1e5

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    # The vitest suite ran in NO workflow. Six test files existed and none of
    # them executed on a push or a pull request, so a frontend regression could
    # only be caught by someone running `npm test` locally and remembering to.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: opencv_surveillance/frontend/package-lock.json

      - name: Install
        working-directory: opencv_surveillance/frontend
        # --legacy-peer-deps matches the Dockerfile's frontend stage; without it
        # the two resolve differently and CI stops testing what ships.
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        working-directory: opencv_surveillance/frontend
        run: npx vitest run --reporter=default

      - name: Build
        working-directory: opencv_surveillance/frontend
        # A suite that passes against source that will not build is not much of
        # a gate. This also produces frontend/dist, which several backend tests
        # skip without.
        run: npm run build

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
    - name: Free up disk space
      run: |
        # Remove unnecessary tools and libraries to free up space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test)
      uses: docker/build-push-action@v5
      with:
        context: ./opencv_surveillance
        file: ./opencv_surveillance/Dockerfile
        push: false
        load: true
        tags: openeye:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm openeye:test python -c "import cv2, numpy; print('✅ Dependencies OK')"
