name: CI - Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libopencv-dev \
          libopenblas-dev \
          liblapack-dev \
          portaudio19-dev \
          libgl1 \
          libglib2.0-0 \
          ffmpeg
    
    - name: Install Python dependencies
      run: |
        cd opencv_surveillance
        python -m pip install --upgrade pip
        # Use lightweight CI requirements to avoid disk space issues
        pip install -r requirements-ci.txt
        # ecosystem_auth (public appEcosystem repo) — pinned to a commit SHA to
        # prevent an unpinned-branch supply-chain change entering the build (F-06).
        # Bump this SHA deliberately when appEcosystem is intentionally updated.
        pip install "ecosystem-auth @ git+https://github.com/M1K31/appEcosystem.git@7bdeed0d2af8d6afbb28ef90bc10687267ab51f6#subdirectory=auth/python"
    
    - name: Run linting
      run: |
        cd opencv_surveillance
        pip install flake8 black
        # HARD GATE: real breakage (syntax errors, undefined names) fails the build.
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=__pycache__,venv
        # ADVISORY: style issues are reported but do not fail the build (--exit-zero).
        flake8 backend --count --exit-zero --max-line-length=120 --exclude=__pycache__,venv --ignore=E501,W503,E203 --statistics

    - name: Run tests
      env:
        # ecosystem auth is fail-closed; throwaway secret so auth paths run in CI.
        ECOSYSTEM_HMAC_SECRET: "ci-test-secret-not-for-production-0123456789abcdef"
      run: |
        cd opencv_surveillance
        # Tests must pass — no masking. A failing suite now fails the pipeline (F-03).
        pytest tests/ -v --cov=backend --cov-report=xml -x --ignore=tests/e2e
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./opencv_surveillance/coverage.xml
        flags: unittests
        name: codecov-umbrella
      if: matrix.python-version == '3.11'
      continue-on-error: true

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
    - name: Free up disk space
      run: |
        # Remove unnecessary tools and libraries to free up space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test)
      uses: docker/build-push-action@v5
      with:
        context: ./opencv_surveillance
        file: ./opencv_surveillance/Dockerfile
        push: false
        load: true
        tags: openeye:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm openeye:test python -c "import cv2, numpy; print('✅ Dependencies OK')"
