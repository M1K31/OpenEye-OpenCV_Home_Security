[pytest]
# Pytest configuration for OpenEye

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage settings
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, API endpoints)
    slow: Slow tests (may take several seconds)
    api: API endpoint tests
    auth: Authentication/authorization tests
    camera: Camera-related tests
    face: Face recognition tests
    recording: Recording tests
    asyncio: Asynchronous tests using asyncio

# Ignore warnings from third-party packages
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::UserWarning:face_recognition_models.*

# Minimum coverage threshold (fail if below)
# Set to 60% initially, increase as tests are added
# Uncomment to enforce:
# --cov-fail-under=60
