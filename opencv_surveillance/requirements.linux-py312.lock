# OpenEye — pinned dependency set for Linux / CPython 3.12
#
# Generated inside python:3.12-slim with pip-compile, so it reflects what Linux
# actually resolves rather than what macOS resolved. Regenerate with:
#
#   docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out -w /src python:3.12-slim \
#     bash -c "pip install -q pip-tools && pip-compile --no-header \
#              --output-file=/out/requirements.linux-py312.lock requirements.txt"
#
# Companion to requirements.lock, which is macOS/arm64/CPython 3.12 only. Two
# platforms need two locks: wheels, and sometimes versions, differ.
#
# NOTE ON setuptools
# pip-compile treats setuptools as "unsafe" and omits it, so the
# `setuptools>=68.0,<82` bound in requirements.txt does not survive into this
# file. That bound matters: setuptools 82 removed pkg_resources, and
# face_recognition_models imports it at module load. Without the pin the install
# succeeds and the application cannot start. It is therefore restated at the
# bottom of this file by hand — keep it when regenerating.
#
# Reassuring result on first generation: Linux resolved to the same versions as
# the shipped macOS bundle for every package that matters — fastapi 0.141.1,
# starlette 1.6.0, numpy 1.26.4, opencv-contrib-python 4.10.0.84. The upper
# bounds added to requirements.txt on 2026-08-22 are holding both platforms to
# the same set.
#
