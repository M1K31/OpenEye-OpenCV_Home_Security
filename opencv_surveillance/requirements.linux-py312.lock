# OpenEye — pinned dependency set for Linux / CPython 3.12
#
# WHAT THIS IS
# The exact versions the Docker image installs. Resolved on linux/amd64 with
# CPython 3.12, which is what the Dockerfile runs and what docker-publish.yml
# builds (`platforms: linux/amd64`).
#
# WHY IT EXISTS
# requirements.lock is resolved on macOS/arm64 and says so in its own header:
# "Linux and Docker need their own lock generated on that platform; do not
# assume this file resolves there." This is that file. Until it existed the
# Dockerfile's optional COPY never matched, so every image build fell through to
# resolving requirements.txt fresh from PyPI, and two builds of the same commit
# could ship different software.
#
# WHY setuptools IS PINNED HERE
# pip-compile omits setuptools and wheel as build tooling unless --allow-unsafe
# is given. That omission is not harmless: requirements.txt caps setuptools
# below 82 because face_recognition_models imports pkg_resources at module load,
# and python:3.12-slim ships NO setuptools at all. A lock without it installs
# perfectly and then leaves face recognition silently disabled — the package
# present and unable to import. Regenerate with --allow-unsafe.
#
# WHAT IS NOT IN IT
# dlib and face_recognition, which are optional and come from
# requirements-face-recognition.txt; and the ecosystem packages. The Dockerfile
# installs both separately.
#
# NO HASHES, DELIBERATELY
# --generate-hashes would pin artefacts as well as versions, but a hash set
# resolved here refuses to install anywhere the wheels differ — an arm64 image
# among them. Pinned versions give reproducibility; hashes would give a build
# that works on one architecture. Revisit if arm64 publishing is added: that
# needs its own lock, not hashes on this one.
#
# HOW TO REGENERATE
# Do not edit by hand. Run the "Regenerate the Linux lock" workflow, or locally:
#
#     docker run --rm -v "$PWD:/w" -w /w python:3.12-slim sh -c \
#       'pip install -q pip-tools && pip-compile --strip-extras --allow-unsafe \
#          --output-file=requirements.linux-py312.lock requirements.txt'
#
