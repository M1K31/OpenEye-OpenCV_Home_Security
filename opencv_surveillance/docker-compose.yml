# OpenEye v3.11.4 - Docker Compose Configuration
#
# FIRST-RUN SETUP:
# 1. Generate secrets: See below or run setup-production.sh
# 2. Start the container: docker compose up -d
# 3. Open http://localhost:8000/
# 4. Complete the interactive setup wizard to create your admin account
#
# For detailed configuration, see: https://github.com/M1K31/OpenEye

services:
  # Init service to set up directories with correct permissions
  # Fixes: https://github.com/M1K31/OpenEye-OpenCV_Home_Security/issues/6
  init-permissions:
    image: busybox
    user: root
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./faces:/app/faces
      - ./models:/app/models
    command: >
      sh -c "
        mkdir -p /app/data/recordings /app/data/faces /app/data/logs &&
        mkdir -p /app/recordings /app/faces /app/models &&
        chown -R 1000:1000 /app/data /app/recordings /app/faces /app/models &&
        echo 'Permissions configured for UID 1000'
      "
    restart: "no"

  # Main OpenEye application
  openeye:
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openeye-surveillance
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=sqlite:///./data/openeye.db

      # Security (REQUIRED - generate unique keys for production)
      # Generate with: openssl rand -hex 32
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key}
      # Generate with: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - NOTIFICATION_ENCRYPTION_KEY=${NOTIFICATION_ENCRYPTION_KEY:-}

      # Server binding (optional)
      - OPENEYE_HOST=${OPENEYE_HOST:-0.0.0.0}
      - OPENEYE_PORT=${OPENEYE_PORT:-8000}

      # MagicMirror ecosystem (optional)
      - MAGICMIRROR_HOST=${MAGICMIRROR_HOST:-}
      - MAGICMIRROR_PORT=${MAGICMIRROR_PORT:-}

      # CORS (optional)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}

      # Application settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_FACE_RECOGNITION=${ENABLE_FACE_RECOGNITION:-true}
      - MAX_RECORDING_DURATION=${MAX_RECORDING_DURATION:-300}

    volumes:
      # Persistent data
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./faces:/app/faces
      - ./models:/app/models

    restart: unless-stopped

    networks:
      - openeye-network

    # Resource limits (adjust based on your hardware)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Uncomment for NVIDIA GPU acceleration
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  openeye-network:
    driver: bridge
