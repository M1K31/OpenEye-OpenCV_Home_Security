# OpenEye — pinned dependency set
#
# WHAT THIS IS
# Captured from the shipped macOS .app bundle on 2026-08-22, which is a
# known-good, running combination: camera capture, face recognition, auth and
# the ecosystem client were all verified working against exactly these versions.
#
# WHY IT EXISTS
# requirements.txt uses `>=` with almost no upper bounds and there was no lock,
# so two installs a week apart produced different software. That is not
# hypothetical: the shipped bundle runs fastapi 0.141.1 / starlette 1.6.0 while
# the test suite was running fastapi 0.128.8 / starlette 0.49.3 — a major
# Starlette apart. The suite was certifying a combination no user had.
#
# PLATFORM
# macOS / arm64 / CPython 3.12.8. Linux and Docker need their own lock generated
# on that platform; do not assume this file resolves there. Regenerate with:
#   pip-compile requirements.txt -o requirements.lock --generate-hashes
# run on the target platform and Python version.
#
# HOW TO USE
# Builds install from this file, not from requirements.txt:
#   pip install --no-deps -r requirements.lock
# requirements.txt stays the human-edited input describing intent.
#
